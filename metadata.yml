Status: Ready
Title: Antimicrobial activity prediction from EU OpenScreen data
Description: Predicts growth inhibition across seven reference pathogens spanning
  Gram-negative and Gram-positive bacteria and Candida albicans. The training data
  come from an EU OpenScreen campaign in which roughly 100,000 compounds were screened
  through the European Chemical Biology Library, giving unusually consistent coverage
  since all seven organisms were tested against the same collection. Models were built
  with LazyQSAR and report a rank score rather than a calibrated probability.
